<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Obrigado</title>
    <meta name="description" content="Obrigado pela sua mensagem - Portf&oacute;lio Leonardo Dalmazzo" />
    <!-- Performance para o CDN -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">

    <!-- Font Awesome (carrega os ícones) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
        integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- CSS centralizado -->
    <link rel="stylesheet" href="css/style.css" />
    <style>
        .thanks-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            padding: 2rem;
        }

        .thanks-page h1 {
            font-size: 2.5rem;
            color: var(--color-main);
            margin-bottom: 1rem;
        }

        .thanks-page p {
            font-size: 1.1rem;
            max-width: 600px;
            color: var(--color-text);
            margin-bottom: 2rem;
        }

        body.dark .thanks-page p {
            color: var(--color-text-dark);
        }
    </style>
</head>

<body>
    <main class="thanks-page" data-aos="fade-up">
        <h1><i class="fas fa-check-circle"></i> Obrigado!</h1>
        <p>Sua mensagem foi enviada com sucesso. Agrade&ccedil;o pelo interesse e retornarei assim que poss&iacute;vel.</p>
        <a href="index.html" class="btn-glow-bounce">
            <i class="fas fa-home"></i> Voltar ao in&iacute;cio
        </a>
    </main>

    <script>
        const savedTheme = localStorage.getItem("theme");
        if (savedTheme === "dark") {
            document.body.classList.add("dark");
        }
    </script>

    <script src="components/layout/header/header.js"></script>
    <script src="components/layout/footer/footer.js"></script>
    <script src="js/colorCustomizer.js"></script>

</body>

</html>
